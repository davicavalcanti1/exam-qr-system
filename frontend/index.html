<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExameQR</title>
    <link rel="icon" type="image/png" href="/brotopay.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Fustat:wght@200..800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <script>
      // Aplica o tema salvo antes da 1ª pintura (evita flash de tela clara).
      (function () {
        try {
          var p = localStorage.getItem('exameqr-theme') || 'light';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(180deg,#EFFBF2 0%,#FBF6DE 100%);font-family:Inter,sans-serif">
        <img src="/brotopay.png" alt="ExameQR" style="width:84px;height:84px;object-fit:contain" />
        <div style="font-family:Fustat,Inter,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;color:#0E9E4E">ExameQR</div>
        <div style="width:34px;height:34px;border:4px solid #16B85E;border-top-color:transparent;border-radius:50%;animation:bootspin .8s linear infinite"></div>
      </div>
      <style>@keyframes bootspin{to{transform:rotate(360deg)}}.dark #boot-splash{background:linear-gradient(180deg,#0E1613 0%,#0C120F 100%)!important}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
